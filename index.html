
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="description" content="TomateLab. Revelado y escaneado de carretes analógicos en blanco y negro.">
<title>TomateLab — Revelado analógico en blanco y negro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e33b32;
  --green:#287447;
  --black:#151515;
  --white:#f5f3eb;
  --paper:#e9e6dc;
  --display:"Space Grotesk",Arial,sans-serif;
  --sans:"Space Grotesk",Arial,sans-serif;
  --mono:"Courier Prime",monospace;
  --line:1px solid rgba(21,21,21,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--black);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:inherit}
button,input,select,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
.grain{
  position:fixed;inset:0;z-index:20;pointer-events:none;opacity:.13;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' seed='17' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='.72'/%3E%3C/svg%3E"),
    radial-gradient(ellipse at 16% 20%,rgba(227,59,50,.10),transparent 43%),
    radial-gradient(ellipse at 82% 76%,rgba(40,116,71,.09),transparent 46%);
  background-size:125px 125px,100% 100%,100% 100%;
  mix-blend-mode:soft-light;
}
.wrap{width:min(1160px,calc(100% - 64px));margin:auto}
.eyebrow,.tag,.button,.film-label,.mono{font-family:var(--sans)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(21,21,21,.97);color:var(--white);border-bottom:1px solid rgba(245,243,235,.22)}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font:700 22px var(--sans);text-decoration:none;letter-spacing:-1.2px}
.brand b{color:var(--red);font-weight:700}
.navlinks{display:flex;gap:28px}
.navlinks a{font:600 11px var(--sans);text-decoration:none;text-transform:uppercase;letter-spacing:.1em}
.navlinks a:hover{color:#ff766d}
.menu{display:none;background:none;border:1px solid rgba(245,243,235,.65);color:var(--white);padding:8px 12px;font:600 11px var(--sans);letter-spacing:.08em}

/* Marcos fotográficos */
.window{background:var(--white);border:1px solid rgba(21,21,21,.35);box-shadow:0 12px 35px rgba(21,21,21,.08)}
.windowbar{min-height:34px;background:var(--black);color:var(--white);display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.windowbar .lights{display:none}

/* Apertura: degradados suaves y grano orgánico */
.intro-story{
  position:relative;
  overflow:clip;
  background-color:var(--white);
  background-image:
    radial-gradient(ellipse at 8% 18%,rgba(227,59,50,.13),transparent 36%),
    radial-gradient(ellipse at 91% 76%,rgba(40,116,71,.12),transparent 40%),
    linear-gradient(118deg,#f5f3eb 0%,#e9e6dc 52%,#f5f3eb 100%);
}
.intro-story:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.24;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4' seed='19' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
  background-size:190px 190px;
  mix-blend-mode:multiply;
}
.intro-layout{
  position:relative;
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  grid-template-rows:minmax(620px,85vh) minmax(420px,65vh);
  grid-template-areas:"hero photo" "reveal .";
  gap:0 46px;
  align-items:stretch;
}
.hero-copy{grid-area:hero;min-width:0;min-height:85vh;padding:42px 0;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:700 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.led{width:7px;height:7px;background:var(--green);display:inline-block;border-radius:50%}
.hero-copy h1{font:600 clamp(48px,6.2vw,82px)/.98 var(--display);letter-spacing:-.055em;margin:24px 0 22px;max-width:590px}
.hero-copy h1 span{color:var(--red)}
.hero-copy>p{font-size:16px;max-width:460px;margin:0 0 30px;color:#45433f}
.button{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:13px 18px;background:var(--red);color:white;border:1px solid var(--red);font:700 11px var(--mono);text-transform:uppercase;text-decoration:none;letter-spacing:.08em;transition:background .2s,color .2s}
.button:hover{background:var(--black);border-color:var(--black)}

/* Fotografía: posición normal, sin sticky ni desplazamiento por scroll */
.hero-art{
  grid-area:photo;
  position:relative;
  top:auto;
  align-self:center;
  height:min(72vh,680px);
  min-height:430px;
  display:flex;
  align-items:center;
  padding:20px 18px 26px;
  z-index:1;
}
.hero-art:before{
  content:"";
  position:absolute;
  inset:4% -7%;
  background:
    radial-gradient(ellipse at 18% 24%,rgba(227,59,50,.17),transparent 40%),
    radial-gradient(ellipse at 84% 78%,rgba(40,116,71,.16),transparent 43%),
    radial-gradient(ellipse at 52% 48%,rgba(21,21,21,.13),transparent 65%);
  filter:blur(16px);
  transform:rotate(-5deg);
  pointer-events:none;
}
.hero-art:after{
  content:"";
  position:absolute;
  inset:3% -7%;
  z-index:0;
  pointer-events:none;
  opacity:.22;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='film'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' seed='27' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23film)'/%3E%3C/svg%3E");
  background-size:170px 170px;
  mix-blend-mode:multiply;
}
.photo-window{position:relative;z-index:1;width:100%;transform:rotate(-.6deg);background:var(--black);box-shadow:0 22px 55px rgba(21,21,21,.2)}
.photo-frame{padding:15px;background:#171717;position:relative;overflow:hidden}

/* Revelado automático de negativo a positivo en cinco segundos */
@keyframes filmDevelop{
  0%{filter:grayscale(1) invert(1) contrast(1.08)}
  100%{filter:grayscale(1) invert(0) contrast(1.08)}
}
.photo-frame img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  filter:grayscale(1) invert(1) contrast(1.08);
  animation:filmDevelop 5s ease-in-out forwards;
  background:#555;
  will-change:filter;
}
@media(prefers-reduced-motion:reduce){
  .photo-frame img{animation:none;filter:grayscale(1) contrast(1.08)}
}
.photo-caption{display:flex;justify-content:space-between;gap:12px;color:var(--white);padding-top:12px;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.film-edge{display:flex;justify-content:space-between;gap:7px;padding:8px 10px;background:var(--black)}
.film-edge span{height:12px;flex:1;border:1px solid rgba(245,243,235,.75);border-radius:2px;opacity:.75}
.hero-status{position:absolute;right:0;bottom:12%;background:var(--green);color:white;padding:9px 13px;border:1px solid var(--green);font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.reveal-copy{grid-area:reveal;min-width:0;min-height:85vh;padding:45px 0;display:flex;flex-direction:column;justify-content:center;position:relative}
.reveal-copy h2{font:600 clamp(40px,5vw,64px)/1.02 var(--display);letter-spacing:-.05em;margin:15px 0 20px;max-width:460px}
.reveal-copy p{max-width:390px;color:#45433f}

/* Secciones */
section.content{padding:90px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:38px}
.section-head h2{font:600 clamp(40px,5vw,64px)/1.02 var(--display);letter-spacing:-.02em;margin:10px 0 0}
.section-head p{max-width:390px;margin:0;font-size:14px;color:#55524c}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;display:inline-flex;align-items:center;gap:9px}
.tag:before{content:"";width:20px;height:1px;background:var(--red)}

/* Precios */
.pricing{background:var(--paper)}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.price-card{
  border:1px solid rgba(21,21,21,.35);
  background-color:var(--white);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' seed='33' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='.30'/%3E%3C/svg%3E"),radial-gradient(ellipse at 100% 100%,rgba(21,21,21,.075),transparent 68%);
  background-size:165px 165px,cover;
  background-blend-mode:soft-light,normal;
  position:relative;
  overflow:hidden;
}
.price-card:nth-child(2){
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain2'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' seed='37' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain2)' opacity='.28'/%3E%3C/svg%3E"),radial-gradient(ellipse at 12% 15%,rgba(227,59,50,.11),transparent 58%),linear-gradient(145deg,rgba(255,255,255,.92),rgba(233,230,220,.82));
  background-size:165px 165px,cover,cover;
  background-blend-mode:soft-light,normal,normal;
}
.price-card:nth-child(3){
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain3'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' seed='41' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain3)' opacity='.28'/%3E%3C/svg%3E"),radial-gradient(ellipse at 88% 18%,rgba(40,116,71,.12),transparent 58%),linear-gradient(145deg,rgba(255,255,255,.92),rgba(233,230,220,.82));
  background-size:165px 165px,cover,cover;
  background-blend-mode:soft-light,normal,normal;
}
.card-top{padding:12px 16px;background:var(--black);color:white;font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}
.card-body{padding:25px 22px 26px;min-height:195px;display:flex;flex-direction:column}
.card-body h3{font:600 30px/1 var(--display);margin:0 0 10px}
.card-body p{font-size:13px;margin:0;max-width:240px;color:#55524c}
.price{font:600 43px/1 var(--display);margin-top:auto;padding-top:25px;letter-spacing:-.02em}
.price small{font:500 16px var(--sans)}
.card-bottom{height:9px;background:linear-gradient(90deg,rgba(21,21,21,.05),rgba(21,21,21,.18),rgba(21,21,21,.04))}

/* Laboratorio */
.details{
  background-color:var(--black);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 190 190' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='darkgrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='4' seed='47' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23darkgrain)' opacity='.20'/%3E%3C/svg%3E"),radial-gradient(ellipse at 4% 88%,rgba(227,59,50,.10),transparent 42%),radial-gradient(ellipse at 92% 14%,rgba(40,116,71,.13),transparent 48%),linear-gradient(125deg,#151515,#1a1c19 58%,#151515);
  background-size:180px 180px,cover,cover,cover;
  background-blend-mode:soft-light,normal,normal,normal;
  color:var(--white);
  position:relative;
  overflow:hidden;
}
.details:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.28;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='darkgrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='5' seed='47' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23darkgrain)'/%3E%3C/svg%3E");
  background-size:165px 165px;
  mix-blend-mode:soft-light;
}
.details .section-head{position:relative;z-index:1}
.details .section-head p{color:rgba(245,243,235,.68)}
.details .tag:before{background:var(--green)}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 28px;position:relative;z-index:1;border-top:1px solid rgba(245,243,235,.28)}
.detail-card{position:relative;min-height:142px;margin:14px 0;padding:31px 34px;display:flex;align-items:center;background:radial-gradient(ellipse at 92% 15%,rgba(40,116,71,.10),transparent 58%),linear-gradient(110deg,rgba(245,243,235,.065),rgba(245,243,235,.018));border:1px solid rgba(245,243,235,.52);box-shadow:inset 0 0 0 4px rgba(245,243,235,.025);overflow:hidden}
.detail-card:nth-child(3n + 2){background:radial-gradient(ellipse at 8% 80%,rgba(227,59,50,.09),transparent 58%),linear-gradient(110deg,rgba(245,243,235,.065),rgba(245,243,235,.018))}
.detail-card:nth-child(3n){background:radial-gradient(ellipse at 82% 15%,rgba(40,116,71,.11),transparent 58%),linear-gradient(110deg,rgba(245,243,235,.065),rgba(245,243,235,.018))}
.detail-card:before,.detail-card:after{content:"";position:absolute;left:14px;right:14px;height:8px;border:0;border-radius:2px;background:repeating-linear-gradient(to right,transparent 0 7px,rgba(245,243,235,.92) 7px 19px,transparent 19px 30px);opacity:.9}
.detail-card:before{top:9px}.detail-card:after{bottom:9px}
.detail-num{position:absolute;right:29px;top:13px;font:700 9px var(--mono);color:#8cc49b;letter-spacing:.1em}
.detail-card p{margin:0;padding-right:34px;font-size:15px;line-height:1.55;color:rgba(245,243,235,.94);max-width:470px}

/* Instagram */
.social{
  background-color:var(--white);
  color:var(--black);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 190 190' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='socialgrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.74' numOctaves='4' seed='53' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23socialgrain)' opacity='.22'/%3E%3C/svg%3E"),radial-gradient(ellipse at 8% 50%,rgba(227,59,50,.10),transparent 46%),radial-gradient(ellipse at 92% 50%,rgba(40,116,71,.10),transparent 46%);
  background-size:170px 170px,cover,cover;
  background-blend-mode:soft-light,normal,normal;
}
.social-panel{display:grid;grid-template-columns:1fr auto;gap:35px;align-items:center;padding:38px 0;border-top:1px solid rgba(21,21,21,.35);border-bottom:1px solid rgba(21,21,21,.35);background:transparent;color:var(--black)}
.social h2{font:600 clamp(38px,4.8vw,60px)/1.02 var(--display);letter-spacing:-.02em;margin:12px 0 16px;max-width:760px}
.social p{max-width:550px;margin:0;font-size:14px;color:#55524c}
.social .button{white-space:nowrap}

/* Pedido */
.order{
  background-color:var(--paper);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 190 190' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='ordergrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.74' numOctaves='4' seed='61' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23ordergrain)' opacity='.20'/%3E%3C/svg%3E"),radial-gradient(ellipse at 0% 18%,rgba(227,59,50,.09),transparent 36%),radial-gradient(ellipse at 100% 82%,rgba(40,116,71,.10),transparent 38%);
  background-size:170px 170px,cover,cover;
  background-blend-mode:soft-light,normal,normal;
}
.order-intro{max-width:620px;margin:-12px 0 35px;color:#55524c}
.order-window{max-width:900px;margin:0 auto}
.order-window .windowbar{background:var(--black)}
.form-inner{padding:clamp(20px,4vw,38px)}
.form-section{padding:27px 0;border-top:1px solid rgba(21,21,21,.22)}
.form-section:first-child{border-top:0;padding-top:0}
.form-section h3{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:0 0 20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label,.field-label{font:700 10px var(--sans);text-transform:uppercase;letter-spacing:.09em}
.field input,.field textarea,.field select{width:100%;border:1px solid #aaa;background:rgba(255,255,255,.72);padding:12px;color:var(--black);border-radius:0;min-height:46px;font:400 14px var(--sans)}
.field input:focus,.field textarea:focus,.field select:focus{outline:1px solid var(--green);outline-offset:2px}
.field textarea{min-height:88px;resize:vertical}
.field small{font-size:11px;color:#666}
.packs{display:grid;gap:10px}
.pack{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:16px;border:1px solid #aaa;cursor:pointer;background:rgba(255,255,255,.72)}
.pack:has(input:checked){border:1px solid var(--red);background:#f7efeb}
.pack input{accent-color:var(--red)}
.pack strong{font:600 21px var(--display)}
.pack small{display:block;font-size:11px;color:#555}
.pack b{font:600 23px var(--display);white-space:nowrap}
.iso-panel{display:none;margin-top:18px;padding:18px;border:1px solid rgba(40,116,71,.45);background:rgba(40,116,71,.055)}
.iso-panel.visible{display:block}
.iso-panel h4{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:0 0 15px}
.iso-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.summary{margin-top:22px;padding:20px;background:var(--black);color:white}
.summary h4{font:600 11px var(--sans);margin:0 0 12px;text-transform:uppercase;letter-spacing:.1em}
.summary-line,.summary-total{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:12px}
.summary-line[hidden]{display:none}
.summary-total{border-top:1px solid #777;margin-top:10px;padding-top:14px;font:600 25px var(--display)}
.payment{padding:17px;border:1px solid rgba(227,59,50,.65);font-size:13px;line-height:1.7}
.payment strong{display:block;font:700 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:17px;font-size:11px;line-height:1.6}
.consent input{margin-top:4px;accent-color:var(--green)}
.submit{width:100%;margin-top:23px;padding:16px;background:var(--red);color:white;border:1px solid var(--red);font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.1em;opacity:.55;cursor:not-allowed}
.form-note{font-size:11px;color:#666;margin:12px 0 0}

/* Pie */
.footer{background:var(--black);color:var(--white);padding:35px 0}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.footer p{font:600 9px var(--sans);line-height:1.8;letter-spacing:.1em}
.footer a{font-size:12px}
.footer .brand{font-size:19px}
.closing{padding:34px 20px;background:var(--red);color:var(--white);text-align:center;border-top:1px solid var(--black)}
.closing p{margin:0;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.closing .tomato{display:inline-block;margin-left:7px;font-size:22px;vertical-align:middle}

/* Confirmación */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:20px}
.modal-box{width:min(620px,100%);background:var(--white);border:1px solid var(--black);padding:clamp(24px,5vw,42px)}
.modal-box h2{font:600 clamp(38px,5vw,58px)/1.02 var(--display);margin:15px 0}
.modal-box p,.modal-box li{font-size:14px;line-height:1.7}
.modal-box ul{padding-left:20px;margin:16px 0}

@media(max-width:800px){
  .wrap{width:min(100% - 36px,620px)}
  .intro-layout{grid-template-columns:1fr;grid-template-rows:auto auto auto;grid-template-areas:"hero" "photo" "reveal";gap:0}
  .hero-copy{min-height:54vh;padding:42px 0 24px}
  .hero-art{grid-row:auto;position:relative;top:auto;height:auto;min-height:0;align-sel
